name: project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  image_picker: ^1.1.0
  provider: ^6.1.2
  fluttertoast: ^8.2.5
  flutter_loader: ^0.2.6
  path_provider: ^2.1.3
  path: ^1.9.0
  sqflite: ^2.3.3+1
  firebase_storage: ^12.3.7
  responsive_framework: ^1.4.0
  flutter_stripe: ^11.3.0
  url_launcher: ^6.3.1
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2

flutter_icons:
  android: true
  ios: true
  image_path: "assets/ic_launcher.png"
  adaptive_icon_foreground: "assets/ic_launcher_foreground.png"  # Optional if you have a separate foreground image
  adaptive_icon_background: "assets/ic_launcher_background.png"  # Optional if you have a separate background image
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/ic_launcher.png
